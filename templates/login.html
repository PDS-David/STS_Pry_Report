<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ school_info.name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container { text-align: center; margin-bottom: 30px; }

        .logo-img {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            display: block;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .logo-container h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .contact-info {
            background: #f7fafc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13px;
        }

        .contact-info p { margin: 5px 0; color: #555; }
        .contact-info strong { color: #333; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }

        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: #f7fafc;
            font-size: 15px;
            transition: .3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            color: white; border: none;
            border-radius: 10px;
            font-size: 16px; font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: .3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.4);
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .info-box {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #0050b3;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 12px;
        }

    </style>
</head>
<body>
    <div class="login-container">

        <div class="logo-container">
            <!-- USE LOGO2 HERE -->
            <img src="{{ url_for('static', filename='logo2.png') }}" class="logo-img">

            <h1>{{ school_info.name }}</h1>
            <p>School Management System</p>
        </div>

        <!-- FIXED CONTACT DETAILS -->
        <div class="contact-info">
            <p><strong>📍 Address:</strong> Olosan Road, Alakia, Ibadan</p>
            <p><strong>📞 Phone:</strong> 08033269042, 08138044735</p>
        </div>

        {% if error %}
        <div class="error"><strong>⚠️ Login Failed</strong><br>{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">
                <label>👤 Username</label>
                <input type="text" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" name="password" required>
            </div>

            <button class="btn-login">Login to Dashboard</button>
        </form>

        <div class="info-box">
            <strong>🔐 Default Credentials:</strong>
            <p><strong>Username:</strong> admin</p>
            <p><strong>Password:</strong> password123</p>
        </div>

        <div class="footer">
            <p>{{ school_info.motto }}</p>
            <p style="font-size:11px;color:#999;">© 2025 {{ school_info.name }}</p>
        </div>
    </div>
</body>
</html>
