<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Terms - SOW THE SEED NURSERY & PRIMARY SCHOOL</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #5568d3; }
        .back-btn { background: #666; margin-right: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f7f7f7; font-weight: bold; }
        .active { color: green; font-weight: bold; }
        .checkbox { width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📅 Manage Academic Terms</h2>
        
        <form method="POST">
            <div class="form-group">
                <label>Term Name:</label>
                <input type="text" name="name" placeholder="e.g., First Term" required>
            </div>
            <div class="form-group">
                <label>Academic Year:</label>
                <input type="text" name="academic_year" placeholder="e.g., 2024/2025" required>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="is_current" class="checkbox"> 
                    Set as Current/Active Term
                </label>
            </div>
            <a href="/dashboard"><button type="button" class="back-btn">← Back</button></a>
            <button type="submit">Add Term</button>
        </form>
        
        <h3 style="margin-top: 30px;">All Terms</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Term</th>
                    <th>Academic Year</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for term in terms %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ term.name }}</td>
                    <td>{{ term.academic_year }}</td>
                    <td>
                        {% if term.is_current %}
                            <span class="active">✓ Active</span>
                        {% else %}
                            Inactive
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
