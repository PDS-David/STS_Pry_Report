<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Subjects</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #5568d3; }
        .back-btn { background: #666; margin-right: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f7f7f7; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📚 Manage Subjects</h2>
        
        <form method="POST">
            <div class="form-group">
                <label>Subject Name:</label>
                <input type="text" name="name" placeholder="e.g., Mathematics" required>
            </div>
            <div class="form-group">
                <label>Subject Code (Optional):</label>
                <input type="text" name="code" placeholder="e.g., MATH">
            </div>
            <a href="/dashboard"><button type="button" class="back-btn">← Back</button></a>
            <button type="submit">Add Subject</button>
        </form>
        
        <h3 style="margin-top: 30px;">Current Subjects</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Code</th>
                </tr>
            </thead>
            <tbody>
                {% for subject in subjects %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ subject.name }}</td>
                    <td>{{ subject.code or 'N/A' }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
