services:
  - type: web
    name: sow-the-seed-school
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sow-the-seed-db
          property: connectionString

databases:
  - name: sow-the-seed-db
    databaseName: school_db
    user: school_user